<!doctype html>
<html lang="en" class="qm qm-spacious qm-bgimg qm-halo qm-halo-read qm-on-mail">
<head><meta charset="utf-8"><title>Umbra · a conversation</title>
<link rel="stylesheet" href="/umbra.css"><link rel="stylesheet" href="/demo.css"><link rel="stylesheet" href="/scenes/scene.css"><script src="/scenes/tint.js"></script></head>
<body>
<div id="qm-view">
  <div class="qm-host">
    <div class="qm-screen qm-thread">
      <div class="qm-head">
        <h1>Thursday's review</h1>
        <div class="qm-hsub"><span><button type="button" class="qm-whois">lena.park@northfield.studio</button></span></div>
        <div class="qm-sumslot"></div>
      </div>
      <div class="qm-convo"><div class="qm-convo-in">
        <div class="qm-msg">
          <div class="qm-meta"><span class="qm-av qm-mav qm-tint" style="background:#7c8cf0">LP</span><span><button type="button" class="qm-whois">Lena Park</button> · Oct 7, 4:10 PM</span></div>
          <div class="qm-bwrap"><div class="qm-bubble"><div class="qm-body qm-chat"><div>Hi! The review is Thursday at 11, in the small room. I'll send the agenda tomorrow.</div></div></div></div>
        </div>
        <div class="qm-msg qm-mine">
          <div class="qm-meta"><span>Oct 7, 5:02 PM</span></div>
          <div class="qm-bwrap"><div class="qm-bubble"><div class="qm-body qm-chat"><div>Sounds good. I'll bring the slides.</div></div></div></div>
        </div>
        <div class="qm-msg">
          <div class="qm-meta"><span class="qm-av qm-mav qm-tint" style="background:#7c8cf0">LP</span><span><button type="button" class="qm-whois">Lena Park</button> · 2:47 PM</span></div>
          <div class="qm-bwrap"><div class="qm-bubble"><div class="qm-body qm-chat"><div>Could we move it to 2? I'd like Sam there too, and the slides by Wednesday if you can.</div><div><br></div><div>Thank you!</div></div></div></div>
        </div>
      </div></div>
      <div class="qm-cslot">
        <div class="qm-composer"><div class="qm-ctop"><div class="qm-ideas"></div></div>
          <div class="qm-cbox"><div class="qm-crow">
            <button type="button" class="qm-ib qm-s" tabindex="-1">{{icon:clip}}</button>
            <div class="qm-cfield"><textarea rows="1" placeholder="Reply" tabindex="-1"></textarea></div>
            <button type="button" class="qm-ib qm-s" tabindex="-1">{{icon:grow}}</button>
            <button type="button" class="qm-send" disabled tabindex="-1">{{icon:send}}</button>
          </div></div>
        </div>
      </div>
      <div class="qm-bar qm-left"><button type="button" class="qm-ib" tabindex="-1">{{icon:back}}</button></div>
      <div class="qm-bar qm-right"><button type="button" class="qm-ib" tabindex="-1">{{icon:done}}</button><button type="button" class="qm-ib" tabindex="-1">{{icon:later}}</button><button type="button" class="qm-ib" tabindex="-1">{{icon:more}}</button></div>
    </div>
  </div>
</div>
</body>
</html>
