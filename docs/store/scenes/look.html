<!doctype html>
<html lang="en" class="qm qm-v-list qm-spacious">
<head><meta charset="utf-8"><title>Umbra · how it looks</title><link rel="stylesheet" href="/umbra.css"><link rel="stylesheet" href="/demo.css"><link rel="stylesheet" href="/scenes/scene.css"></head>
<body>
<iframe class="beside" src="/scenes/inbox-light.html" tabindex="-1"></iframe>
<div id="qm-intro" class="qm-i-split">
  <canvas class="qm-i-sky"></canvas>
  <section class="qm-i-step qm-i-page qm-i-on">
    <h2>How it looks</h2>
    <div class="qm-i-choice"><span class="qm-i-label">Theme</span><div class="qm-i-opts"><button type="button" class="qm-i-opt" aria-pressed="false" tabindex="-1"><span>Dark</span></button><button type="button" class="qm-i-opt" aria-pressed="true" tabindex="-1"><span>Light</span></button><button type="button" class="qm-i-opt" aria-pressed="false" tabindex="-1"><span>Match my Mac</span></button></div></div>
    <div class="qm-i-choice"><span class="qm-i-label">Style</span><div class="qm-i-opts"><button type="button" class="qm-i-opt" aria-pressed="false" tabindex="-1"><span>Flat</span></button><button type="button" class="qm-i-opt" aria-pressed="true" tabindex="-1"><span>Soft</span><small>raised, with soft shadows</small></button></div></div>
    <div class="qm-i-choice"><span class="qm-i-label">Background</span><div class="qm-i-opts"><button type="button" class="qm-i-opt" aria-pressed="true" tabindex="-1"><span>Plain</span></button><button type="button" class="qm-i-opt" aria-pressed="false" tabindex="-1"><span>Sky</span><small>follows the time of day</small></button></div></div>
    <p class="qm-i-note">More in Settings › Look: your own picture, colors, fonts, spacing.</p>
    <div class="qm-i-actions"><button type="button" class="qm-i-next" tabindex="-1">Continue</button><button type="button" class="qm-i-back" tabindex="-1">Back</button></div>
  </section>
  <div class="qm-i-dots"><i></i><i></i><i class="qm-i-cur"></i><i></i><i></i></div>
  <button type="button" class="qm-i-skip" tabindex="-1">Skip</button>
</div>
<script src="/eclipse.js"></script>
<script src="/scenes/sky.js" data-x=".38" data-y=".14" data-size=".035" data-dim=".12"></script>
</body>
</html>
