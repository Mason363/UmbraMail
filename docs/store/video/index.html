<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Umbra · a calmer Gmail</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* Umbra's two faces, from the extension */
  @font-face { font-family: "Newsreader"; font-weight: 200 800; src: url("assets/fonts/newsreader-latin-opsz-normal.woff2") format("woff2"); }
  @font-face { font-family: "Instrument Sans"; font-weight: 400 700; src: url("assets/fonts/instrument-sans-latin-wght-normal.woff2") format("woff2"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0b0d; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0b0b0d; color: #f3f2ef; -webkit-font-smoothing: antialiased; }

  /* the words: the name, and one line under each screen */
  .card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .name { display: block; font: 380 168px/1 "Newsreader", Georgia, serif; letter-spacing: -0.03em; }
  .tag { display: block; margin-top: 26px; font: 400 40px/1.3 "Instrument Sans", system-ui, sans-serif; color: rgba(243, 242, 239, 0.8); }
  .small { display: block; margin-top: 46px; font: 400 26px/1.5 "Instrument Sans", system-ui, sans-serif; color: rgba(243, 242, 239, 0.56); }
  .cap { position: absolute; left: 0; right: 0; top: 944px; height: 80px; display: flex; align-items: center; justify-content: center; }
  .cap span { display: block; font: 400 32px/1.3 "Instrument Sans", system-ui, sans-serif; letter-spacing: -0.005em; color: rgba(243, 242, 239, 0.86); }

  /* the window Umbra plays in, on a soft glow of its own color */
  .glow { position: absolute; left: 260px; top: 150px; width: 1400px; height: 700px; border-radius: 50%; background: #1f4fd6; filter: blur(150px); opacity: 0; }
  .cam { position: absolute; left: 192px; top: 48px; width: 1536px; height: 864px; opacity: 0; }
  .frame { position: absolute; inset: 0; border-radius: 20px; overflow: hidden; background: #0b0b0d; box-shadow: 0 50px 140px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.07); }
  .frame video { position: absolute; inset: 0; width: 1536px; height: 864px; display: block; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="34" data-width="1920" data-height="1080">

  <section id="title" class="clip card" data-start="0" data-duration="3.6" data-track-index="0">
    <span class="name" id="t-name">Umbra</span>
    <span class="tag" id="t-tag">A calmer Gmail.</span>
  </section>

  <div class="glow" id="glow"></div>
  <div class="cam" id="cam">
    <div class="frame" id="frame">
      <video id="v-inbox" class="clip" src="assets/clips/inbox.mp4" muted playsinline data-start="3.2" data-duration="6.4" data-track-index="1"></video>
      <video id="v-convo" class="clip" src="assets/clips/convo.mp4" muted playsinline data-start="9.0" data-duration="7.4" data-track-index="2"></video>
      <video id="v-palette" class="clip" src="assets/clips/palette.mp4" muted playsinline data-start="15.8" data-duration="5.2" data-track-index="1"></video>
      <video id="v-paper" class="clip" src="assets/clips/paper.mp4" muted playsinline data-start="20.4" data-duration="5.2" data-track-index="2"></video>
      <video id="v-colors" class="clip" src="assets/clips/colors.mp4" muted playsinline data-start="25.0" data-duration="5.2" data-track-index="1"></video>
    </div>
  </div>

  <div id="c1" class="clip cap" data-start="3.9" data-duration="5.1" data-track-index="3"><span>Your inbox, quiet and easy to read.</span></div>
  <div id="c2" class="clip cap" data-start="9.6" data-duration="6.1" data-track-index="3"><span>Every conversation, easy to follow.</span></div>
  <div id="c3" class="clip cap" data-start="16.4" data-duration="3.9" data-track-index="3"><span>⌘K does almost anything.</span></div>
  <div id="c4" class="clip cap" data-start="21.0" data-duration="3.9" data-track-index="3"><span>Newsletters in one page.</span></div>
  <div id="c5" class="clip cap" data-start="25.6" data-duration="3.9" data-track-index="3"><span>Any color you like.</span></div>

  <section id="end" class="clip card" data-start="29.9" data-duration="4.1" data-track-index="0">
    <span class="name" id="e-name">Umbra</span>
    <span class="tag" id="e-tag">A calmer Gmail.</span>
    <span class="small" id="e-small">Private, free and open source · umbra.masn.studio</span>
  </section>

  <audio id="bed" src="assets/bed.wav" data-start="0" data-duration="34" data-track-index="4" data-volume="1"></audio>
</div>
<script>
  document.fonts.ready.then(() => {
    const tl = gsap.timeline({ paused: true });
    const rise = (el, t, d = 1.4) => tl.fromTo(el, { opacity: 0, y: 18, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: d, ease: "power3.out" }, t);
    const sink = (el, t) => tl.to(el, { opacity: 0, y: -10, filter: "blur(8px)", duration: 0.6, ease: "power2.in" }, t);

    // the name
    rise("#t-name", 0.3, 1.5);
    rise("#t-tag", 0.95, 1.2);
    sink(["#t-name", "#t-tag"], 2.85);

    // the window comes up, drifts closer as it plays, and goes before the end
    tl.fromTo("#cam", { opacity: 0, y: 50, scale: 0.955 }, { opacity: 1, y: 0, scale: 1, duration: 1.2, ease: "power3.out" }, 3.1);
    tl.fromTo("#frame", { scale: 1 }, { scale: 1.025, duration: 26.4, ease: "none" }, 3.1);
    tl.to("#cam", { opacity: 0, y: -16, scale: 0.975, duration: 0.8, ease: "power2.inOut" }, 29.3);

    // each screen softens as the next comes into focus over it (a blur dissolve: never two sharp layouts at once)
    for (const [out, id, t] of [["#v-inbox", "#v-convo", 9.0], ["#v-convo", "#v-palette", 15.8], ["#v-palette", "#v-paper", 20.4], ["#v-paper", "#v-colors", 25.0]]) {
      tl.fromTo(out, { filter: "blur(0px)" }, { filter: "blur(18px)", duration: 0.6, ease: "sine.in" }, t);
      tl.fromTo(id, { opacity: 0, filter: "blur(18px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "sine.out" }, t);
    }

    // the glow takes each screen's color
    tl.fromTo("#glow", { opacity: 0 }, { opacity: 0.5, duration: 1.4, ease: "sine.out" }, 3.1);
    const hue = (c, t, d = 0.8, o) => tl.to("#glow", Object.assign({ backgroundColor: c, duration: d, ease: "sine.inOut" }, o == null ? {} : { opacity: o }), t);
    hue("#cc1f66", 9.0);
    hue("#0f8f4a", 15.8);
    hue("#3b4252", 20.4, 0.8, 0.32);
    hue("#1f4fd6", 25.0, 0.6, 0.5);
    hue("#cc1f66", 25.7, 0.7);
    hue("#0f8f4a", 26.9, 0.7);
    hue("#6a3fd8", 28.1, 0.7);
    tl.to("#glow", { opacity: 0, duration: 0.9, ease: "sine.inOut" }, 29.3);

    // a line under each screen
    for (const [id, t, d] of [["#c1", 3.9, 5.1], ["#c2", 9.6, 6.1], ["#c3", 16.4, 3.9], ["#c4", 21.0, 3.9], ["#c5", 25.6, 3.9]]) {
      tl.fromTo(id + " span", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, t + 0.05);
      tl.to(id + " span", { opacity: 0, duration: 0.4, ease: "power2.in" }, t + d - 0.45);
    }

    // the name again, and where to get it
    rise("#e-name", 30.15, 1.5);
    rise("#e-tag", 30.75, 1.2);
    rise("#e-small", 31.35, 1.2);
    tl.to(["#e-name", "#e-tag", "#e-small"], { opacity: 0, duration: 0.7, ease: "sine.in" }, 33.25);

    window.__timelines["main"] = tl;
  });
</script>
</body>
</html>
