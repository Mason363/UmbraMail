<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Umbra · a calmer Gmail</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* Umbra's two faces, from the extension */
  @font-face { font-family: "Newsreader"; font-weight: 200 800; src: url("assets/fonts/newsreader-latin-opsz-normal.woff2") format("woff2"); }
  @font-face { font-family: "Instrument Sans"; font-weight: 400 700; src: url("assets/fonts/instrument-sans-latin-wght-normal.woff2") format("woff2"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #09090b; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #09090b; color: #f3f2ef; -webkit-font-smoothing: antialiased; }

  /* the light each screen casts on the dark around it: the screen itself (a small copy), blurred */
  .amb { position: absolute; left: 610px; top: 197px; width: 1220px; height: 686px; transform: scale(1.3); filter: blur(90px) saturate(1.4); opacity: 0; }
  .amb video, .amb img { position: absolute; inset: 0; width: 1220px; height: 686px; display: block; opacity: 0; }

  /* one window, flat; each screen a layer in it, revealed over the last */
  .win { position: absolute; left: 610px; top: 197px; width: 1220px; height: 686px; border-radius: 20px; overflow: hidden; background: #09090b; opacity: 0;
    box-shadow: 0 50px 120px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.08); }
  .scr { position: absolute; inset: 0; }
  .scr video, .scr img { position: absolute; inset: 0; width: 1220px; height: 686px; display: block; }

  /* the words: a line beside each screen, rising word by word out of a mask */
  .hl { position: absolute; left: 100px; top: 0; bottom: 0; width: 470px; display: flex; align-items: center; }
  .hl p { font: 380 60px/1.1 "Newsreader", Georgia, serif; letter-spacing: -0.022em; color: #f3f2ef; }
  .ln { display: block; white-space: nowrap; }
  .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 0.14em; margin-bottom: -0.14em; }
  .i { display: inline-block; }

  /* the eclipse at each end, drawn frame by frame (eclipse.py) */
  .full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="53.1" data-fps="60" data-width="1920" data-height="1080">

  <div class="amb" id="amb">
    <video id="a-inbox" class="clip" src="assets/clips/glow-inbox.mp4" muted playsinline data-start="4.8" data-duration="8.3" data-track-index="1"></video>
    <video id="a-tides" class="clip" src="assets/clips/glow-tides.mp4" muted playsinline data-start="11.5" data-duration="7.3" data-track-index="2"></video>
    <video id="a-convo" class="clip" src="assets/clips/glow-convo.mp4" muted playsinline data-start="17.2" data-duration="8.3" data-track-index="1"></video>
    <video id="a-palette" class="clip" src="assets/clips/glow-palette.mp4" muted playsinline data-start="23.9" data-duration="6.6" data-track-index="2"></video>
    <video id="a-paper" class="clip" src="assets/clips/glow-paper.mp4" muted playsinline data-start="28.9" data-duration="6.6" data-track-index="1"></video>
    <img id="a-blue" src="assets/looks/glow-blue.jpg" alt="" />
    <img id="a-pink" src="assets/looks/glow-pink.jpg" alt="" />
    <img id="a-green" src="assets/looks/glow-green.jpg" alt="" />
    <img id="a-mountains" src="assets/looks/glow-mountains.jpg" alt="" />
    <img id="a-sunset" src="assets/looks/glow-sunset.jpg" alt="" />
    <img id="a-sea" src="assets/looks/glow-sea.jpg" alt="" />
  </div>

  <!-- each screen plays on, still, until the wipe over it is done -->
  <div class="win" id="win">
    <div class="scr" id="s-inbox"><video id="v-inbox" class="clip" src="assets/clips/inbox.mp4" muted playsinline data-start="4.8" data-duration="8.3" data-track-index="3"></video></div>
    <div class="scr" id="s-tides"><video id="v-tides" class="clip" src="assets/clips/tides.mp4" muted playsinline data-start="11.5" data-duration="7.3" data-track-index="4"></video></div>
    <div class="scr" id="s-convo"><video id="v-convo" class="clip" src="assets/clips/convo.mp4" muted playsinline data-start="17.2" data-duration="8.3" data-track-index="3"></video></div>
    <div class="scr" id="s-palette"><video id="v-palette" class="clip" src="assets/clips/palette.mp4" muted playsinline data-start="23.9" data-duration="6.6" data-track-index="4"></video></div>
    <div class="scr" id="s-paper"><video id="v-paper" class="clip" src="assets/clips/paper.mp4" muted playsinline data-start="28.9" data-duration="6.6" data-track-index="3"></video></div>
    <div class="scr" id="s-blue"><img src="assets/looks/blue.png" alt="" /></div>
    <div class="scr" id="s-pink"><img src="assets/looks/pink.png" alt="" /></div>
    <div class="scr" id="s-green"><img src="assets/looks/green.png" alt="" /></div>
    <div class="scr" id="s-mountains"><img src="assets/looks/mountains.png" alt="" /></div>
    <div class="scr" id="s-sunset"><img src="assets/looks/sunset.png" alt="" /></div>
    <div class="scr" id="s-sea"><img src="assets/looks/sea.png" alt="" /></div>
  </div>

  <section id="h1" class="clip hl" data-start="5.2" data-duration="6.85" data-track-index="5"><p><span class="ln">What needs you,</span><span class="ln">at the top.</span></p></section>
  <section id="h2" class="clip hl" data-start="11.7" data-duration="6.05" data-track-index="6"><p><span class="ln">New mail,</span><span class="ln">a few times a day.</span></p></section>
  <section id="h3" class="clip hl" data-start="17.4" data-duration="7.05" data-track-index="5"><p><span class="ln">Email that reads</span><span class="ln">like messages.</span></p></section>
  <section id="h4" class="clip hl" data-start="24.1" data-duration="5.35" data-track-index="6"><p><span class="ln">Find any email</span><span class="ln">in a few letters.</span></p></section>
  <section id="h5" class="clip hl" data-start="29.1" data-duration="5.35" data-track-index="5"><p><span class="ln">Newsletters,</span><span class="ln">in one page.</span></p></section>
  <section id="h6" class="clip hl" data-start="34.1" data-duration="11.6" data-track-index="6"><p><span class="ln">Your colors.</span><span class="ln">Your pictures.</span></p></section>

  <video id="v-intro" class="clip full" src="assets/clips/eclipse-intro.mp4" muted playsinline data-start="0" data-duration="4.8" data-track-index="0"></video>
  <video id="v-outro" class="clip full" src="assets/clips/eclipse-outro.mp4" muted playsinline data-start="46.1" data-duration="7.0" data-track-index="0"></video>

  <audio id="bed" src="assets/bed.wav" data-start="0" data-duration="53.1" data-track-index="7" data-volume="1"></audio>
</div>
<script>
  // words, each in a mask it rises out of
  const masked = (el) => {
    const wrap = (t) => t.trim().split(" ").map((p) => `<span class="w" data-layout-allow-overflow><span class="i">${p}</span></span>`).join(" ");
    const lines = [...el.querySelectorAll(".ln")];
    if (lines.length) lines.forEach((l) => { l.innerHTML = wrap(l.textContent); });
    else el.innerHTML = wrap(el.textContent);
    return [...el.querySelectorAll(".i")];
  };
  document.fonts.ready.then(() => {
    const tl = gsap.timeline({ paused: true });
    const rise = (els, t, stagger = 0.06, d = 1.0) => tl.fromTo(els, { yPercent: 105, opacity: 0 }, { yPercent: 0, opacity: 1, duration: d, ease: "power3.out", stagger }, t);
    const leave = (els, t, stagger = 0.03) => tl.to(els, { yPercent: -105, opacity: 0, duration: 0.6, ease: "power2.in", stagger }, t);
    const line = (id, tin, tout) => { const ws = masked(document.querySelector(id + " p")); rise(ws, tin); leave(ws, tout); };

    // the next screen is revealed over the last, a clean edge moving from right to left. Nothing large moves: a big
    // layer drifting a fraction of a pixel a frame steps unevenly, and that reads as choppy. (A sine ease starts and
    // ends softly and never whips through the middle.)
    const reveal = (from, to, t, d = 1.3) => {
      tl.fromTo("#s-" + to, { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: d, ease: "sine.inOut" }, t);
      tl.to("#a-" + from, { opacity: 0, duration: d, ease: "sine.inOut" }, t);
      tl.fromTo("#a-" + to, { opacity: 0 }, { opacity: 1, duration: d, ease: "sine.inOut" }, t);
    };
    tl.set(".scr:not(#s-inbox)", { clipPath: "inset(0% 0% 0% 100%)" }, 0);

    // (first, the eclipse: the moon moves off the sun and leaves the name on it; then the light goes out)

    // the window settles in, and its light with it
    tl.fromTo("#win", { opacity: 0 }, { opacity: 1, duration: 1.1, ease: "sine.inOut" }, 4.8);
    tl.fromTo("#amb", { opacity: 0 }, { opacity: 0.5, duration: 1.6, ease: "sine.inOut" }, 4.8);
    tl.fromTo("#a-inbox", { opacity: 0 }, { opacity: 1, duration: 0.1 }, 4.8);

    line("#h1", 5.3, 11.15);
    reveal("inbox", "tides", 11.5);
    line("#h2", 11.8, 16.85);
    reveal("tides", "convo", 17.2);
    line("#h3", 17.5, 23.55);
    reveal("convo", "palette", 23.9);
    line("#h4", 24.2, 28.55);
    reveal("palette", "paper", 28.9);
    line("#h5", 29.2, 33.55);

    // your colors, then your pictures: each wiped in over the last, once the last is all in and has been seen
    reveal("paper", "blue", 33.9);
    const h6 = masked(document.querySelector("#h6 p")), pictures = [...document.querySelectorAll("#h6 .ln")[1].querySelectorAll(".i")];
    rise(h6.filter((w) => !pictures.includes(w)), 34.2);
    reveal("blue", "pink", 35.8, 1.2);
    reveal("pink", "green", 37.6, 1.2);
    reveal("green", "mountains", 39.4, 1.2);
    rise(pictures, 39.7);
    reveal("mountains", "sunset", 41.2, 1.2);
    reveal("sunset", "sea", 43.0, 1.2);
    leave(h6, 44.8);

    // the window goes; the eclipse again, and the name with where to find it
    tl.to("#win", { opacity: 0, duration: 1.0, ease: "sine.inOut" }, 45.1);
    tl.to("#amb", { opacity: 0, duration: 1.0, ease: "sine.inOut" }, 45.1);

    window.__timelines["main"] = tl;
  });
</script>
</body>
</html>
